<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Form Taslağı</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f4f4;
    }
    .form-container, .result-container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
    }
    .form-container label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      text-align: left;
    }
    .form-container input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .form-container button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .form-container button:hover {
      background: #0056b3;
    }
    .result-container {
      display: none;
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="form-container" id="form">
    <label for="name">Adın</label>
    <input type="text" id="name" placeholder="Adını gir">

    <label for="number">Numara</label>
    <input type="number" id="number" placeholder="Numaranı gir">

    <button onclick="goNext()">Next</button>
  </div>

  <div class="result-container" id="result">
    <p id="message"></p>
  </div>

  <script>
    function goNext() {
      const name = document.getElementById("name").value;
      const number = document.getElementById("number").value;

      if(name && number) {
        document.getElementById("form").style.display = "none";
        document.getElementById("result").style.display = "block";
        document.getElementById("message").innerText = 
          "Telefon numaranı ve adını öğrendim";
      } else {
        alert("Lütfen tüm alanları doldur!");
      }
    }
  </script>
</body>
</html>
